spring.application.name=restomap-backend
server.port=${PORT:6101}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/restomap_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.mvc.problemdetails.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SENDER_ADRESSE_MAIL}
spring.mail.password=${SENDER_SECRET}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuration HikariCP (économiser le quota Neon)
spring.datasource.hikari.minimum-idle=${NEON_MINIMUM_IDLE:0}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=5

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=openid

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}