<nav class="bg-white border-b border-gray-200 dark:bg-gray-900 dark:border-gray-800 sticky top-0 z-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">

            <div class="cursor-pointer">
                <a routerLink="/" class="flex flex-row items-center justify-center space-x-3">
                    <img src="https://images2.imgbox.com/01/a7/2lTqa8dH_o.png" alt="Logo de Rest'oh Share"
                        class="h-10 w-auto">
                    <span class="text-xl font-semibold text-gray-900 dark:text-white tracking-tight">Rest'oh <span class="text-yellow-500">S</span>hare</span>
                </a>
            </div>

            <div class="flex items-center space-x-6">
                <a routerLink=" /contact" routerLinkActive="text-blue-600 dark:text-blue-400 font-semibold"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="text-gray-600 font-bold hover:text-gray-900 dark:text-gray-300 dark:hover:text-white transition-colors duration-200">
                    Contact
                </a>
                <a hrouterLink="/questions" routerLinkActive="text-blue-600 dark:text-blue-400 font-semibold"
                    class="text-gray-600 font-bold hover:text-gray-900 dark:text-gray-300 dark:hover:text-white flex items-center ransition-colors duration-200">
                    <span>Questions ?</span>
                </a>
                <div class="relative">
                    <button (click)="toggleDropdown()"
                        class="flex items-center space-x-1 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors duration-200 text-gray-700 dark:text-gray-300 focus:outline-none">
                        <div
                            class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center border border-gray-300 dark:border-gray-600">
                            <svg lucideUser class="w-5 h-5"></svg>
                        </div>
                        @if (isDropdownOpen()) {
                        <svg lucideChevronUp class="w-5 h-5 text-gray-800"></svg>
                        } @else {
                        <svg lucideChevronDown class="w-5 h-5 text-gray-800"></svg>
                        }
                    </button>
                    @if (isDropdownOpen()) {
                    <div
                        class="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 font-medium shadow-xl py-2 z-100 transform origin-top-right transition-all duration-150">

                        @if (isLoggedIn()) {
                        <div class="px-4 py-2 border-b border-gray-100 dark:border-gray-700">
                            <p class="text-xs text-gray-400">Compte connecté</p>
                        </div>

                        <a routerLink="/favoris" (click)="isDropdownOpen.set(false)"
                            class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            <svg lucideHeart class="w-5 h-5 text-red-500"></svg>
                            <span>Mes favoris</span>
                        </a>

                        <a routerLink="/contributions" (click)="isDropdownOpen.set(false)"
                            class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            <svg lucideFileText class="w-5 h-5 text-blue-500"></svg>
                            <span>Mes contributions</span>
                        </a>

                        <hr class="border-gray-100 dark:border-gray-700 my-1">

                        <button (click)="logout()"
                            class="w-full flex items-center space-x-3 px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors text-left">
                            <svg lucideLogOut class="w-5 h-5"></svg>
                            <span>Se déconnecter</span>
                        </button>
                        }

                        @else {
                        <a routerLink="/favoris" (click)="isDropdownOpen.set(false)"
                            class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            <svg lucideHeart class="w-5 h-5 text-gray-400"></svg>
                            <span>Mes favoris</span>
                        </a>

                        <hr class="border-gray-100 dark:border-gray-700 my-1">

                        <a routerLink="/login" (click)="isDropdownOpen.set(false)"
                            class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            <svg lucideLogIn class="w-5 h-5 text-green-500"></svg>
                            <span>Se connecter</span>
                        </a>

                        <a routerLink="/register" (click)="isDropdownOpen.set(false)"
                            class="flex items-center space-x-3 px-4 py-2.5 text-sm text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950/30 transition-colors">
                            <svg lucideUserPlus class="w-5 h-5"></svg>
                            <span>Créer un compte</span>
                        </a>
                        }

                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</nav>
