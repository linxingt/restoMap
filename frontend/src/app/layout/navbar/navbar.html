<nav class="bg-white border-b-2 border-black fixed top-0 left-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
        <a routerLink="/" class="flex items-center gap-3">
            <img src="https://i.ibb.co/hxvz2vGb/image.png" alt="Logo" class="h-8 w-auto">
            <span class="text-xl font-bold text-black tracking-tight">Rest'oh <span
                    class="text-yellow-700">S</span>hare</span>
        </a>

        <div class="flex items-center gap-8">
            <a routerLink="/contact" routerLinkActive="text-[#834008]" [routerLinkActiveOptions]="{exact: true}"
                class="text-black font-bold hover:text-[#834008] transition-colors">
                Contact
            </a>
            <a routerLink="/questions" routerLinkActive="text-[#834008]"
                class="text-black font-bold hover:text-[#834008] transition-colors">
                Questions ?
            </a>

            <div class="relative">
                <button (click)="toggleDropdown()" class="flex items-center gap-2 outline-none">
                    @if (authService.isLoggedIn()) {
                    <div
                        class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm">
                        {{ getUsernameInitial() }}
                    </div>
                    } @else {
                    <div class="w-10 h-10 rounded-xl bg-[#EDC87F] text-[#834008] flex items-center justify-center">
                        <svg lucideUser class="w-5 h-5"></svg>
                    </div>
                    }
                </button>

                @if (isDropdownOpen()) {
                <div class="absolute right-0 mt-3 w-64 bg-white border-2 border-black rounded-2xl p-2 z-50">
                    @if (authService.isLoggedIn()) {
                    <div class="px-3 py-2 mb-2 bg-gray-100 rounded-xl">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">{{authService.getUsername()}}</p>
                    </div>
                    <a routerLink="/favoris" (click)="isDropdownOpen.set(false)"
                        class="flex items-center gap-3 px-3 py-3 font-bold text-black hover:bg-[#EDC87F] rounded-xl transition-colors">
                        <svg lucideHeart class="w-5 h-5"></svg> Favoris
                    </a>
                    <a routerLink="/restaurants/new" (click)="isDropdownOpen.set(false)"
                        class="flex items-center gap-3 px-3 py-3 font-bold text-black hover:bg-[#EDC87F] rounded-xl transition-colors">
                        <svg lucideSquarePlus class="w-5 h-5"></svg> Nouveau restaurant
                    </a>
                    <button (click)="logout()"
                        class="w-full mt-2 flex items-center gap-3 px-3 py-3 font-bold text-white bg-black hover:bg-gray-800 rounded-xl transition-colors">
                        <svg lucideLogOut class="w-5 h-5"></svg> Déconnexion
                    </button>
                    } @else {
                    <button (click)="openLoginModal()"
                        class="w-full flex items-center gap-3 px-3 py-3 font-bold text-black bg-[#EDC87F] hover:bg-[#e0b96a] rounded-xl transition-colors">
                        <svg lucideLogIn class="w-5 h-5"></svg> Se connecter
                    </button>
                    <button (click)="openRegisterModal()"
                        class="w-full mt-2 flex items-center gap-3 px-3 py-3 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors">
                        <svg lucideUserPlus class="w-5 h-5"></svg> Créer un compte
                    </button>
                    }
                </div>
                }
            </div>
        </div>
    </div>
</nav>
