<form [formGroup]="commentForm" (ngSubmit)="submitComment()" class="bg-[#EDC87F]/20 p-6 rounded-3xl space-y-3">
  <h3 class="text-[18px] font-bold text-black tracking-tight">Votre avis</h3>

  <div class="flex flex-wrap items-center gap-3">
    <div class="flex bg-white px-3 py-1 rounded-xl" (mouseleave)="hoveredStar.set(null)">
      @for (star of [1, 2, 3, 4, 5]; track star) {
      <button type="button" (click)="setRating(star)" (mouseenter)="hoveredStar.set(star)"
        class="text-2xl text-[#834008] focus:outline-none">
        {{ star <= activeRating ? '★' : '☆' }} </button>
          }
    </div>

    <input type="number" formControlName="pricePerPerson" placeholder="Prix / pers (€)"
      class="w-32 px-3 py-2 bg-white rounded-xl border-none focus:ring-2 focus:ring-black outline-none font-bold text-black" />

    <button type="button" (click)="toggleIsGood()"
      [class]="commentForm.controls.isGood.value ? 'bg-orange-500 text-white' : 'bg-gray-300 text-black'"
      class="px-3 py-2 rounded-xl font-bold transition-colors">
      @if (commentForm.controls.isGood.value) {
      <span class="flex items-center gap-2">
        <svg lucideThumbsUp class="w-4 h-4"></svg>
        Recommandé
      </span>
      } @else {
      <span class="flex items-center gap-2">
        <svg lucideThumbsDown class="w-3 h-3"></svg>
        À éviter
      </span>
      }
    </button>
  </div>

  <div class="space-y-2">
    <span class="text-sm font-bold text-[#834008] uppercase tracking-wide">Points forts</span>
    <div class="flex flex-wrap gap-2">
      @for (tag of availableTags; track tag) {
      <button type="button" (click)="toggleTag(tag)"
        [class]="isTagSelected(tag) ? 'bg-black text-white' : 'bg-white text-black'"
        class="px-3 py-2 rounded-xl font-bold transition-colors">
        {{ tag }}
      </button>
      }
    </div>
  </div>

  <div>
    <textarea rows="3" formControlName="content"
      placeholder="Partagez votre expérience (cadre, service, plat recommandé...)"
      class="w-full p-4 bg-white rounded-2xl border-none focus:ring-2 focus:ring-black outline-none font-medium text-black resize-none"></textarea>

    <div class="flex justify-between items-center text-xs text-gray-400">
      @if (commentForm.controls.content.hasError('maxlength')) {
      <span class="text-rose-500 font-medium">Le texte ne doit pas dépasser 500 caractères.</span>
      } @else {
      <span></span>
      }
      <span [class.text-amber-600]="contentLength > 450">{{ contentLength }} / 500</span>
    </div>
  </div>

  <div class="flex justify-end pt-1">
    <button type="submit" [disabled]="isSubmitting() || commentForm.invalid"
      class="px-4 py-2 bg-black text-white font-bold rounded-2xl disabled:opacity-30 transition-colors">
      {{ isSubmitting() ? 'Envoi...' : 'Publier' }}
    </button>
  </div>
</form>
