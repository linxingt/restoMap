<div class="w-full h-screen flex overflow-hidden mt-16 bg-white">

  <div class="w-full md:w-1/2 lg:w-2/5 h-screen overflow-y-auto p-6 border-r-2 border-black bg-[#EDC87F]/10">
    <div class="mb-6">
      <app-restaurant-filter [cuisineOptions]="availableCuisines()" />
    </div>

    @if (isLoading()) {
    <div class="p-8 text-center font-bold text-xl text-[#834008]">
      Chargement des restaurants...
    </div>
    } @else {
    <div class="space-y-4">
      @for (restaurant of restaurants(); track restaurant.id) {
      <app-restaurant-card [restaurant]="restaurant" (hover)="hoveredRestaurantId.set($event)" />
      } @empty {
      <div class="p-8 text-center font-bold text-black bg-white border-2 border-black rounded-3xl">
        Aucun restaurant trouvé.
      </div>
      }
    </div>
    @if (totalPages() > 1) {
    <div class="flex justify-between items-center mt-8 mb-24 bg-white p-3 border-2 border-black rounded-2xl">
      <button (click)="goToPage(currentPage() - 1)" [disabled]="currentPage() === 0"
        class="px-5 py-3 bg-black text-white rounded-xl font-bold text-sm disabled:opacity-20 transition-colors">
        Précédent
      </button>

      <span class="font-bold text-[#834008] text-sm">
        Page {{ currentPage() + 1 }} / {{ totalPages() }}
      </span>

      <button (click)="goToPage(currentPage() + 1)" [disabled]="currentPage() + 1 >= totalPages()"
        class="px-5 py-3 bg-black text-white rounded-xl font-bold text-sm disabled:opacity-20 transition-colors">
        Suivant
      </button>
    </div>
    }
    }
  </div>

  <div class="hidden md:block md:w-1/2 lg:w-3/5 h-screen bg-gray-100">
    <app-restaurant-map [restaurants]="restaurants()" [targetId]="hoveredRestaurantId()" />
  </div>

</div>
