<div class="w-full h-screen flex overflow-hidden">

  <div class="w-full md:w-1/2 lg:w-2/5 h-screen overflow-y-auto p-4">
    <app-restaurant-filter />

    @for (restaurant of filterService.filteredRestaurants(); track $index) {
    <app-restaurant-card [restaurant]="restaurant" />
    }

  </div>

  <!-- MAP -->
  <div class="hidden md:block md:w-1/2 lg:w-3/5 h-screen">
    <app-map [restaurants]="filterService.filteredRestaurants()" />
  </div>

</div>
