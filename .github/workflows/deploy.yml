name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master

# Annule les déploiements en cours si un nouveau push arrive
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Inject API URL
        env:
          API_URL: ${{ vars.RAILWAY_API_URL }}
        run: |
          echo "export const environment = { production: true, apiUrl: '${API_URL}' };" > src/environments/environment.prod.ts
        working-directory: ./frontend

      # 1. Build Angular avec le chemin du repo
      - name: Build Angular
        run: npx ng build --configuration production --base-href /restoMap/
        working-directory: ./frontend

      # 2. Gestion des routes Angular (404.html)
      - name: Copy index.html to 404.html
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      # 3. Compression du dossier compilé en Artifact GitHub
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist/frontend/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4