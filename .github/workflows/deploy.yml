name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master

# Annule les déploiements en cours si un nouveau push arrive
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Angular
        run: npx ng build --configuration production --base-href /restoMap/
        working-directory: ./frontend

      - name: Copy index.html to 404.html
        run: cp ./frontend/dist/frontend/browser/index.html ./frontend/dist/frontend/browser/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist/frontend/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4